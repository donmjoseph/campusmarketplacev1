services:
  mongodb:
    image: mongo:7
    container_name: campus-marketplace-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - app-network

  server:
    build: ./server
    container_name: campus-marketplace-server
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/campus_marketplace
      JWT_SECRET: replace-with-long-random-secret
      JWT_EXPIRES_IN: 7d
      PORT: 5001
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - app-network

  client:
    build: ./client
    container_name: campus-marketplace-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
