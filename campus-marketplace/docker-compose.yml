services:
  mysql:
    image: mysql:8.4
    container_name: campus-marketplace-mysql
    environment:
      MYSQL_DATABASE: campus_marketplace
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus_password
      MYSQL_ROOT_PASSWORD: root_password
    # Host port 3307 so it doesn't clash with a locally installed MySQL on 3306.
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucampus", "-pcampus_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build: ./server
    container_name: campus-marketplace-server
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: mysql://campus:campus_password@mysql:3306/campus_marketplace
      JWT_SECRET: replace-with-long-random-secret
      JWT_EXPIRES_IN: 7d
      PORT: 5001
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Run once to seed demo accounts and listings.
  # Usage: docker compose run --rm seeder
  seeder:
    build: ./server
    container_name: campus-marketplace-seeder
    command: ["node", "src/scripts/seedData.js"]
    environment:
      DATABASE_URL: mysql://campus:campus_password@mysql:3306/campus_marketplace
      JWT_SECRET: replace-with-long-random-secret
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    profiles:
      - seed
    networks:
      - app-network

  client:
    build: ./client
    container_name: campus-marketplace-client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
